name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Core tests, plus the list of <loader>-<minecraft> targets for the matrix below
  mod-core:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: mod
        run: ./gradlew :common:test --no-daemon
      - id: targets
        working-directory: mod
        run: echo "targets=$(./gradlew -q targets --no-daemon | tail -n1)" >> "$GITHUB_OUTPUT"

  mod:
    needs: mod-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.mod-core.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.target }}
        working-directory: mod
        run: ./gradlew :${{ matrix.target }}:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: langenforcer-${{ matrix.target }}
          path: mod/${{ matrix.target }}/build/libs/*.jar

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test
        working-directory: sidecar
        run: uv run pytest -q
      - name: Build image
        run: docker build -t langenforcer-sidecar:ci sidecar
