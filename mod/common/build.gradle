// Loader- and Minecraft-free code. Not a jar of its own: every target compiles these sources into its mod.
plugins {
    id 'java-library'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

dependencies {
    // All provided at runtime by Minecraft or Simple Voice Chat
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
