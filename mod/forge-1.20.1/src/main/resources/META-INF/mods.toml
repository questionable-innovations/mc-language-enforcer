modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/questionable-innovations/mc-language-enforcer/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/questionable-innovations/mc-language-enforcer"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Server-only: clients without the mod can join, and clients with it can join servers without it
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${loader_api_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "voicechat"
mandatory = true
versionRange = "${voicechat_range}"
ordering = "AFTER"
side = "BOTH"
